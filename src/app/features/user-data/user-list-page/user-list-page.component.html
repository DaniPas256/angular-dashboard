<h1 class="page-title">Users</h1>
<p class="page-lead">
  Sample directory: filter, sort, paginate; add or edit in a modal. Everything persists in <code>localStorage</code> until you clear it.
</p>

<div class="toolbar">
  <input
    type="search"
    class="toolbar__search"
    placeholder="Filter by name, email, or role…"
    aria-label="Filter users"
    appDebounceInput
    [appDebounceMs]="280"
    (debouncedValue)="onFilterDebounced($event)"
  />
  <app-button type="button" variant="primary" (clicked)="openCreate()">Add user</app-button>
</div>

@if (selectedUser(); as user) {
  <div class="selection" [appHighlight]="true">
    <span class="selection__text">Selected: <strong>{{ user.name }}</strong></span>
    <div class="selection__actions">
      <app-button type="button" variant="secondary" (clicked)="openEdit(user)">Edit</app-button>
      <app-button type="button" variant="danger" (clicked)="deleteUser(user)">Delete</app-button>
      <app-button type="button" variant="ghost" (clicked)="clearSelection()">Clear</app-button>
    </div>
  </div>
}

<app-card title="Directory">
  <app-table
    [columns]="columns"
    [rows]="view().slice"
    [sortKey]="sortKeyForTable()"
    [sortDir]="sortDirForTable()"
    (sortChange)="onSort($event)"
    (rowClick)="onRowClick($event)"
  />
  <app-pagination
    [page]="page()"
    [pageSize]="pageSize()"
    [total]="view().total"
    (pageChange)="onPageChange($event)"
    (pageSizeChange)="onPageSizeChange($event)"
  />
</app-card>

<app-modal [open]="modalOpen" [title]="modalMode === 'edit' ? 'Edit user' : 'New user'" (close)="closeModal()">
  <app-user-form
    [mode]="modalMode"
    [user]="editingUser"
    (saved)="onSaved($event)"
    (cancelled)="closeModal()"
  />
</app-modal>
