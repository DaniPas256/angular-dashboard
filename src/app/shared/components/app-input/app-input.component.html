<div class="field">
  @if (label()) {
    <label class="field__label" [attr.for]="controlId">{{ label() }}</label>
  }
  <input
    class="field__input"
    [id]="controlId"
    [attr.name]="controlId"
    [type]="type()"
    [placeholder]="placeholder()"
    [attr.autocomplete]="autocomplete() || null"
    [disabled]="disabled"
    [value]="value"
    (input)="onInput($any($event.target).value)"
    (blur)="onBlur()"
  />
</div>
