<section class="card">
  @if (title()) {
    <header class="card__header">
      <h2 class="card__title">{{ title() }}</h2>
      <div class="card__actions">
        <ng-content select="[cardActions]" />
      </div>
    </header>
  }
  <div class="card__body">
    <ng-content />
  </div>
  <footer class="card__footer">
    <ng-content select="[cardFooter]" />
  </footer>
</section>
