@if (open()) {
  <div class="modal" role="dialog" aria-modal="true" [attr.aria-label]="title() || 'Dialog'">
    <div class="modal__backdrop" (click)="onBackdropClick($event)"></div>
    <div class="modal__panel">
      <header class="modal__header">
        @if (title()) {
          <h2 class="modal__title" id="modal-title">{{ title() }}</h2>
        }
        <button type="button" class="modal__close" aria-label="Close" (click)="requestClose()">×</button>
      </header>
      <div class="modal__body">
        <ng-content />
      </div>
      <footer class="modal__footer">
        <ng-content select="[modalFooter]" />
      </footer>
    </div>
  </div>
}
